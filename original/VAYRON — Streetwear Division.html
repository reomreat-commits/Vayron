<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>VAYRON — Streetwear Division</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --milk:#f3eee3;
  --panel:#e9e2d3;
  --ink:#1c2233;
  --navy:#1b2236;
  --brick:#8a4b3a;
  --mute:#6f6a60;
  --line:#dcd4c1;
  --bar-bg:rgba(243,238,227,.92);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
body.dark{
  --milk:#0f0e0d;
  --panel:rgba(30,27,24,.72);
  --ink:#f4f1ec;
  --navy:#f4f1ec;
  --brick:#c97b5a;
  --mute:#b3aca0;
  --line:rgba(244,241,236,.14);
  --bar-bg:rgba(13,12,11,.88);
  color-scheme:dark;
  background:transparent;
}
.site-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#f3eee3;transition:background .5s}
.site-bg i{position:absolute;inset:-60px;background:center 70%/cover no-repeat;filter:blur(10px) brightness(1.15) saturate(.95)}
.site-bg::after{content:"";position:absolute;inset:0;background:rgba(243,238,227,.8);transition:background .5s}
body.dark .site-bg{background:#0d0c0b}
body.dark .site-bg::after{background:radial-gradient(ellipse at 50% 35%,rgba(0,0,0,0),rgba(0,0,0,.4) 80%),linear-gradient(180deg,rgba(13,12,11,.1),rgba(13,12,11,.3))}
body.dark .site-bg{opacity:1}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:transparent;
  color:var(--ink);
  font-family:Jost,Futura,"Century Gothic",sans-serif;
  font-weight:400;
  letter-spacing:.03em;
  line-height:1.45;
  padding-bottom:110px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .5s var(--ease), color .5s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brick);outline-offset:3px}

/* HERO */
.hero{
  position:relative;
  width:100%;
  height:min(85vw, 680px);
  min-height:360px;
  max-height:680px;
  overflow:hidden;
  background:#111;
  color:#fff;
}
.bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.bg img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  transform-origin:center center;
  animation:heroMove 36s cubic-bezier(0.25, 0.1, 0.25, 1) infinite alternate;
  will-change:transform;
}
@keyframes heroMove{
  0%{ transform:scale(1.0); }
  100%{ transform:scale(1.045); }
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    transparent 0%,
    transparent 55%,
    rgba(10,12,18,0.25) 78%,
    rgba(10,12,18,0.72) 100%
  );
  pointer-events:none;
}
.hui{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:2;
  padding:16px 20px 28px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:0;
}
.hui p{display:none}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.b1,.b2{
  padding:14px 26px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  transition:transform .35s var(--ease),background .3s,color .3s,box-shadow .3s,border-color .3s;
  border-radius:0;
}
.b1{background:#fff;color:#111}
.b2{border:1px solid rgba(255,255,255,.9);color:#fff;background:transparent}
.b1:active,.b2:active{transform:scale(.97)}
.b1:hover{box-shadow:0 8px 28px rgba(0,0,0,.3)}
.b2:hover{background:#fff;color:#111;border-color:#fff}

/* entrance */
.rise{
  opacity:0;
  transform:translateY(28px);
  animation:rise 1.1s var(--ease) forwards;
  animation-delay:var(--d,0s);
}
@keyframes rise{to{opacity:1;transform:none}}

/* MARQUEE */
.mq{
  background:var(--navy);
  color:var(--milk);
  overflow:hidden;
  white-space:nowrap;
  padding:14px 0;
  font-weight:500;
  letter-spacing:.28em;
  font-size:13px;
}
.mq div{display:inline-block;animation:mq 32s linear infinite}
.mq span{padding:0 20px;opacity:.45}
@keyframes mq{to{transform:translateX(-50%)}}

/* HEAD */
.head{padding:56px 20px 8px}
.head h2{
  font-size:clamp(42px,12vw,96px);
  font-weight:600;
  line-height:.9;
  letter-spacing:.01em;
  text-transform:uppercase;
}
.head p{
  color:var(--mute);
  font-size:16px;
  max-width:32ch;
  margin-top:14px;
}

/* CHIPS */
.chips{
  display:flex;
  gap:8px;
  padding:18px 16px 20px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1.5px solid var(--ink);
  background:transparent;
  padding:11px 18px;
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
  border-radius:2px;
  transition:background .25s,color .25s,transform .25s var(--ease),border-color .25s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 12px 8px;
}
.card{display:flex;flex-direction:column}
.pic{
  aspect-ratio:4/5;
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative;
  border-radius:3px;
}
.pic svg{
  width:76%;
  height:76%;
  transition:transform .8s var(--ease);
}
.card:active .pic svg{transform:scale(1.06) rotate(-1.5deg)}
.tag{
  position:absolute;
  top:10px;left:10px;
  background:var(--navy);
  color:var(--milk);
  font-size:10px;
  font-weight:500;
  letter-spacing:.12em;
  padding:5px 9px;
  border-radius:2px;
}
.card h3{font-weight:500;font-size:15px;margin:12px 2px 0}
.meta{font-size:12px;color:var(--mute);margin:2px 2px 0}
.szs{display:flex;gap:5px;margin:10px 0 0;flex-wrap:wrap}
.sz{
  min-width:34px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  font-size:12px;
  border-radius:2px;
  transition:all .2s;
}
.sz[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0 0;
  gap:8px;
}
.price{font-size:16px;font-weight:600;white-space:nowrap;flex:1 1 auto;min-width:0}
.add{
  background:var(--navy);
  color:var(--milk);
  flex:0 0 104px;
  width:104px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
  white-space:nowrap;
  text-align:center;
  font-size:11px;
  font-weight:500;
  letter-spacing:.07em;
  text-transform:uppercase;
  border-radius:2px;
  transition:background .25s,transform .25s var(--ease);
}
.add:active{transform:scale(.94)}
.add.ok{background:var(--brick)}

/* BAND */
.band{
  margin-top:64px;
  background:#0a0a0a;
  color:#f5f0e6;
  padding:64px 20px;
}
.band h2{
  font-size:clamp(32px,9vw,72px);
  font-weight:600;
  line-height:1;
  max-width:14ch;
  text-transform:uppercase;
}
.band p{margin-top:18px;max-width:34ch;opacity:.92;font-size:16px}

/* SOCIAL + FOOTER */
.social{
  display:flex;
  gap:16px;
  padding:40px 20px 12px;
  justify-content:center;
}
.social a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;height:48px;
  border:1.5px solid var(--line);
  border-radius:50%;
  transition:background .3s,border-color .3s,transform .3s var(--ease);
}
.social a:active{transform:scale(.92)}
.social a:hover{background:var(--navy);border-color:var(--navy);color:var(--milk)}
.social svg{width:22px;height:22px}
footer{
  padding:16px 20px 28px;
  color:var(--mute);
  font-size:12px;
  text-align:center;
}

/* REVEAL */
.rv{
  opacity:0;
  transform:translateY(24px);
  transition:opacity .85s var(--ease),transform .85s var(--ease);
  transition-delay:calc(var(--i,0)*70ms);
}
.rv.in{opacity:1;transform:none}

/* BOTTOM BAR */
.bar{
  position:fixed;
  left:12px;right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(243,238,227,.85);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:0 10px 32px rgba(28,34,51,.14);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 8px 6px 18px;
  z-index:5;
  border-radius:14px;
  transition:background .45s var(--ease), border-color .45s, box-shadow .45s;
}
body.dark .bar{
  background:rgba(13,12,11,.78);
}
.bar b{font-weight:600;letter-spacing:.28em;font-size:14px}
.bagbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 14px;
  font-weight:500;
  border-radius:10px;
}
.bagbtn svg{width:26px;height:26px}
.count{
  position:absolute;
  top:4px;left:28px;
  min-width:18px;height:18px;
  border-radius:9px;
  background:var(--brick);
  color:#fff;
  font-size:10px;
  display:grid;
  place-items:center;
  padding:0 4px;
}
.count[hidden],.bsum[hidden]{display:none}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.28)}}

/* TOAST */
.toast{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translate(-50%,-100px);
  background:var(--ink);
  color:var(--milk);
  padding:13px 22px;
  font-size:14px;
  z-index:20;
  border-radius:8px;
  transition:transform .45s var(--ease);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.toast.on{transform:translate(-50%,0)}

/* CART SHEET */
.shade{
  position:fixed;inset:0;
  background:rgba(20,22,32,.55);
  opacity:0;pointer-events:none;
  transition:opacity .35s;
  z-index:8;
}
.sheet{
  position:fixed;
  left:0;right:0;bottom:0;
  max-height:86%;
  background:var(--milk);
  z-index:9;
  transform:translateY(105%);
  transition:transform .48s var(--ease);
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
  border-radius:18px 18px 0 0;
}
body.open .shade{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sh-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 22px 16px;
  border-bottom:1px solid var(--line);
  font-size:20px;
  font-weight:600;
}
.items{overflow:auto;padding:0 20px;min-height:100px;-webkit-overflow-scrolling:touch}
.it{
  display:grid;
  grid-template-columns:64px 1fr auto;
  gap:14px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  animation:rise .45s var(--ease) both;
}
.it .t{aspect-ratio:1;display:grid;place-items:center;border-radius:4px}
.it .t svg{width:78%;height:78%}
.it small{color:var(--mute);display:block;font-size:12px}
.qty{display:flex;align-items:center;gap:12px;margin-top:6px}
.qty button{
  width:32px;height:32px;
  border:1px solid var(--ink);
  border-radius:4px;
  font-size:16px;
}
.empty{padding:48px 0;color:var(--mute);text-align:center;font-size:15px}
.foot{padding:16px 20px 22px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;margin-bottom:14px;font-size:18px;font-weight:600}
.pay{
  width:100%;
  background:var(--navy);
  color:var(--milk);
  padding:18px;
  font-size:13px;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  border-radius:6px;
  transition:background .25s;
}
.pay:active{background:var(--brick)}
.guest{text-align:center;font-size:12px;color:var(--mute);margin-top:12px}

/* DESKTOP */
@media (min-width:760px){
  .grid{grid-template-columns:repeat(3,1fr);padding:0 24px;gap:18px}
  .head,.chips,.band,footer,.social{padding-left:48px;padding-right:48px}
  .hero{height:min(72vh, 720px);min-height:540px}
  .hui{padding:24px 48px 44px}
  .sheet{left:auto;width:420px;top:0;max-height:none;border-radius:0;right:0}
  .bar{left:50%;right:auto;width:420px;transform:translateX(-50%);border-radius:16px}
  .card:hover .pic svg{transform:scale(1.07) rotate(-2deg)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rise,.rv{opacity:1;transform:none}
  .bg img{animation:none;transform:scale(1.03)}
}

/* THEME TOGGLE */
.theme-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;height:40px;
  border-radius:10px;
  color:var(--ink);
  transition:transform .35s var(--ease), background .35s, color .35s;
}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .sun{display:none}
body.dark .theme-btn .sun{display:block}
body.dark .theme-btn .moon{display:none}


@keyframes logoIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}
@keyframes lineGrow{
  to{width:56px;opacity:1}
}
@keyframes bounce{
  0%,100%{transform:rotate(45deg) translateY(0);opacity:.5}
  50%{transform:rotate(45deg) translateY(8px);opacity:1}
}
@keyframes glowPulse{
  0%{opacity:.7;transform:scale(1)}
  100%{opacity:1;transform:scale(1.08)}
}







.chip, .add, .perk, .band, .card h3, .meta, .price, .sz, footer, .social a, .sheet, .sh-head, .foot, .pay {
  transition: background .45s var(--ease), color .45s var(--ease), border-color .45s var(--ease);
}


/* SPLASH — VAYRON street scene */
#splash{position:relative;width:100%;height:72svh;min-height:420px;max-height:620px;background:#0d0c0b;overflow:hidden;z-index:1;isolation:isolate}
#vsStage{position:absolute;left:0;top:0;width:1280px;height:853px;transform-origin:0 0}
#vsZoom{position:absolute;inset:0;animation:vsKb 24s ease-in-out infinite alternate}
@keyframes vsKb{from{transform:scale(1)}to{transform:scale(1.04)}}
#vsBg{position:absolute;inset:0;width:1280px;height:853px;filter:blur(1.2px);transform:scale(1.02)}
#splash .vs-s{position:absolute;will-change:transform;pointer-events:none;filter:blur(.6px)}
#splash .vs-c1{--x0:630px;--x1:-840px;animation:vsRide 15s linear -1s infinite,vsBob .7s ease-in-out infinite alternate}
#splash .vs-c2{--x0:320px;--x1:-1150px;animation:vsRide 17s linear -6s infinite,vsBob .8s ease-in-out infinite alternate}
@keyframes vsRide{from{translate:var(--x0) 0}to{translate:var(--x1) 0}}
@keyframes vsBob{from{transform:translateY(0) rotate(-.4deg)}to{transform:translateY(-3px) rotate(.4deg)}}
#splash .vs-p1{animation:vsWalk 9s ease-in-out infinite alternate,vsStep .45s ease-in-out infinite alternate}
#splash .vs-p2{animation:vsWalk 11s ease-in-out -3s infinite alternate-reverse,vsStep .5s ease-in-out infinite alternate}
@keyframes vsWalk{from{translate:0 0}to{translate:34px 0}}
@keyframes vsStep{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#splash .vs-shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.28),rgba(0,0,0,0) 55%,rgba(0,0,0,.45))}
#splash .vs-t{position:absolute;left:0;width:1280px;text-align:center;color:#f4f1ec;font-family:'Jost','Optima','Avenir Next','Helvetica Neue',sans-serif;text-shadow:0 2px 24px rgba(0,0,0,.55)}
#splash .vs-logo{top:352px;font-weight:200;font-size:84px;line-height:1;letter-spacing:.2em;padding-left:.2em;white-space:nowrap}
#splash .vs-logo span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(26px) scale(1.12);animation:vsIn .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.15s + var(--i)*.07s)}
@keyframes vsIn{to{opacity:1;filter:blur(0);transform:none}}
#splash .vs-sub{top:444px;display:flex;align-items:center;justify-content:center;gap:16px;font-weight:300;font-size:18px;letter-spacing:.3em;padding-left:.3em}
#splash .vs-sub i{display:block;height:1px;width:0;background:#f4f1ec;animation:vsLine .8s cubic-bezier(.6,0,.2,1) .9s forwards}
@keyframes vsLine{to{width:84px}}
#splash .vs-sub b{font-weight:300;opacity:0;letter-spacing:.7em;animation:vsSp 1s cubic-bezier(.2,.7,.2,1) 1s forwards}
@keyframes vsSp{to{opacity:1;letter-spacing:.3em}}
#splash .vs-tag{top:480px;font-weight:300;font-size:14px;letter-spacing:.42em;padding-left:.42em;opacity:0;transform:translateY(12px);animation:vsFade .8s ease 1.4s forwards}
@keyframes vsFade{to{opacity:.92;transform:none}}
#splash .vs-btn{position:absolute;left:50%;top:60%;translate:-50% 0;padding:13px 28px;font:500 12px/1 'Jost',system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:#f4f1ec;border:1px solid rgba(244,241,236,.55);background:rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;animation:vsBtn .7s ease 1.7s forwards;transition:background .35s,color .35s,border-color .35s;z-index:3}
@keyframes vsBtn{to{opacity:1}}
#splash .vs-btn:hover{background:rgba(244,241,236,.95);color:#0d0c0b;border-color:transparent}
#splash .vs-scroll{position:absolute;bottom:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:vsBtn .7s ease 2s forwards;z-index:3;pointer-events:none}
#splash .vs-scroll span{font:400 9px/1 'Jost',system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(244,241,236,.6)}
#splash .vs-scroll .arrow{width:12px;height:12px;border-right:1.5px solid rgba(244,241,236,.6);border-bottom:1.5px solid rgba(244,241,236,.6);transform:rotate(45deg);animation:bounce 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* MORE MOTION */
.head.rv h2{display:inline-block;clip-path:inset(0 100% 0 0);transition:clip-path 1.2s var(--ease) .15s}
.head.rv.in h2{clip-path:inset(0 0 0 0)}
.card.rv{transform:translateY(44px) scale(.97)}
.card.rv.in{transform:none}
.card.rv .pic svg{opacity:0;transform:scale(.78) rotate(-5deg)}
.card.rv.in .pic svg{opacity:1;transform:none;transition:transform 1.1s var(--ease) calc(.15s + var(--i,0)*70ms),opacity .8s ease calc(.15s + var(--i,0)*70ms)}
.card .pic{transition:box-shadow .5s var(--ease),transform .5s var(--ease)}
@media (hover:hover){
  .card.rv.in:hover .pic svg{transform:scale(1.07) rotate(-2deg);transition:transform .8s var(--ease)}
  .card:hover .pic{box-shadow:0 18px 38px rgba(0,0,0,.2);transform:translateY(-4px)}
  .add:hover{transform:translateY(-1px);background:var(--brick)}
  .sz:hover,.chip:hover{transform:translateY(-1px)}
  .mq:hover div{animation-play-state:paused}
}
.card.rv.in:active .pic svg{transform:scale(1.06) rotate(-1.5deg)}
.band{position:relative;overflow:hidden;background:linear-gradient(110deg,#0a0a0a 38%,#1a1610 50%,#0a0a0a 62%);background-size:260% 100%;animation:bandShim 10s ease-in-out infinite alternate}
@keyframes bandShim{from{background-position:100% 0}to{background-position:0 0}}
.band::before{content:"";display:block;height:1px;width:0;background:#f5f0e6;margin-bottom:28px;transition:width 1.3s var(--ease) .2s}
.band.in::before{width:84px}
.band.rv h2{opacity:0;transform:translateX(-34px);transition:opacity 1s var(--ease) .25s,transform 1.1s var(--ease) .25s}
.band.rv.in h2{opacity:1;transform:none}
.band.rv p{opacity:0;transform:translateY(16px);transition:opacity 1s ease .55s,transform 1s var(--ease) .55s}

const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12}):null;
const watch=()=>document.querySelectorAll(".rv:not(.in)").forEach(el=>io?io.observe(el):el.classList.add("in"));

function shop(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  $("grid").innerHTML=P.filter(p=>cat==="Все"||p.g===cat).map((p,i)=>{
    const z=sel[p.id]||(sel[p.id]=p.z[Math.min(1,p.z.length-1)]);
    return `<div class="card rv" style="--i:${i%4}">
      <div class="pic" style="background:${p.t}">${p.h?`<span class="tag">${p.h}</span>`:""}${art(p)}</div>
      <h3>${p.n}</h3>
      <div class="meta">${p.c}</div>
      <div class="szs">${p.z.map(s=>`<button class="sz" aria-pressed="${s===z}" data-z="${p.id}|${s}">${s}</button>`).join("")}</div>
      <div class="row"><span class="price">${fmt(p.p)}</span><button class="add" data-a="${p.id}">В корзину</button></div>
    </div>`;
  }).join("");
  watch();
}

function draw(){
  const ks=Object.keys(cart);let n=0,sum=0;
  $("items").innerHTML=ks.length?ks.map(k=>{
    const [i,z]=k.split("|"),p=P.find(x=>x.id==+i),q=cart[k];n+=q;sum+=q*p.p;
    return `<div class="it">
      <div class="t" style="background:${p.t}">${art(p)}</div>
      <div>${p.n}<small>${p.c} · ${z}</small>
        <div class="qty"><button data-m="${k}" aria-label="Меньше">−</button>${q}<button data-pl="${k}" aria-label="Больше">+</button></div>
      </div>
      <div>${fmt(q*p.p)}</div>
    </div>`;
  }).join(""):'<div class="empty">В корзине пока пусто</div>';
  $("count").textContent=n;$("count").hidden=!n;
  $("bsum").textContent=fmt(sum);$("bsum").hidden=!n;
  $("total").textContent=fmt(sum);
}

let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function bump(){const b=$("bagic");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
const toggle=o=>document.body.classList.toggle("open",o);

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){cat=t.dataset.c;shop()}
  if(t.dataset.z){const [i,z]=t.dataset.z.split("|");sel[i]=z;t.parentNode.querySelectorAll(".sz").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  if(t.dataset.a){
    const k=t.dataset.a+"|"+sel[t.dataset.a];
    cart[k]=(cart[k]||0)+1;draw();bump();toast("Добавлено в корзину");
    t.classList.add("ok");t.textContent="Добавлено";
    setTimeout(()=>{t.classList.remove("ok");t.textContent="В корзину"},1100);
  }
  if(t.dataset.pl){cart[t.dataset.pl]++;draw()}
  if(t.dataset.m){if(--cart[t.dataset.m]<1)delete cart[t.dataset.m];draw()}
  if(t.id==="openCart")toggle(true);
  if(t.id==="closeCart")toggle(false);
  if(t.id==="pay")$("items").innerHTML='<div class="empty">Демо: здесь откроется оформление как гость — имя, телефон, адрес.</div>';
});
$("shade").onclick=()=>toggle(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggle(false)});
shop();draw();watch();




// Theme
const themeBtn = document.getElementById("themeBtn");
let saved = null; try{ saved = localStorage.getItem("vayron-theme"); }catch(e){}
if(saved === "dark") document.body.classList.add("dark");
themeBtn.onclick = () => {
  themeBtn.style.transform = "scale(0.85) rotate(-20deg)";
  setTimeout(() => { themeBtn.style.transform = ""; }, 280);
  document.body.classList.toggle("dark");
  try{ localStorage.setItem("vayron-theme", document.body.classList.contains("dark") ? "dark" : "light"); }catch(e){}
};


// Splash: fit street scene to the section (bottom-anchored cover) and place the button
(function(){
  const sec=document.getElementById("splash"),st=document.getElementById("vsStage"),btn=sec&&sec.querySelector(".vs-btn");
  if(!sec||!st)return;
  function fit(){
    const w=sec.clientWidth,h=sec.clientHeight,k=Math.max(w/1280,h/853);
    const L=(w-1280*k)/2,T=h-853*k;
    st.style.transform="translate("+L+"px,"+T+"px) scale("+k+")";
    if(btn)btn.style.top=Math.min(h-78,T+540*k)+"px";
  }
  var bi=document.getElementById("siteBgI"),im=document.getElementById("vsBg");
  if(bi&&im)bi.style.backgroundImage='url("'+im.src+'")';
  fit();addEventListener("resize",fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(sec);
})();
// Parallax for the page background
(function(){
  const bi=document.getElementById("siteBgI");if(!bi)return;let t=false;
  addEventListener("scroll",()=>{if(t)return;t=true;requestAnimationFrame(()=>{t=false;bi.style.transform="translate3d(0,"+(-Math.min(scrollY*.05,50))+"px,0)"})},{passive:true});
})();
</script>
</body>
</html>
