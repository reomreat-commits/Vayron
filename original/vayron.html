<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>VAYRON — Streetwear Division</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --milk:#f7f3ea;
  --panel:#ece5d6;
  --ink:#1c2233;
  --navy:#1b2236;
  --brick:#8a4b3a;
  --mute:#6f6a60;
  --line:#ddd5c4;
  --bar-bg:rgba(247,243,234,.92);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
body.dark{
  --milk:#12141c;
  --panel:#1c2030;
  --ink:#e8e4d8;
  --navy:#e8e4d8;
  --brick:#c97b5a;
  --mute:#9a958a;
  --line:#2a3040;
  --bar-bg:rgba(18,20,28,.92);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--milk);
  color:var(--ink);
  font-family:Jost,Futura,"Century Gothic",sans-serif;
  font-weight:400;
  letter-spacing:.03em;
  line-height:1.45;
  padding-bottom:110px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .5s var(--ease), color .5s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brick);outline-offset:3px}

/* HERO */
.hero{
  position:relative;
  width:100%;
  height:min(85vw, 680px);
  min-height:360px;
  max-height:680px;
  overflow:hidden;
  background:#111;
  color:#fff;
}
.bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.bg img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  transform-origin:center center;
  animation:heroMove 36s cubic-bezier(0.25, 0.1, 0.25, 1) infinite alternate;
  will-change:transform;
}
@keyframes heroMove{
  0%{ transform:scale(1.0); }
  100%{ transform:scale(1.045); }
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    transparent 0%,
    transparent 55%,
    rgba(10,12,18,0.25) 78%,
    rgba(10,12,18,0.72) 100%
  );
  pointer-events:none;
}
.hui{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:2;
  padding:16px 20px 28px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:0;
}
.hui p{display:none}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.b1,.b2{
  padding:14px 26px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  transition:transform .35s var(--ease),background .3s,color .3s,box-shadow .3s,border-color .3s;
  border-radius:0;
}
.b1{background:#fff;color:#111}
.b2{border:1px solid rgba(255,255,255,.9);color:#fff;background:transparent}
.b1:active,.b2:active{transform:scale(.97)}
.b1:hover{box-shadow:0 8px 28px rgba(0,0,0,.3)}
.b2:hover{background:#fff;color:#111;border-color:#fff}

/* entrance */
.rise{
  opacity:0;
  transform:translateY(28px);
  animation:rise 1.1s var(--ease) forwards;
  animation-delay:var(--d,0s);
}
@keyframes rise{to{opacity:1;transform:none}}

/* MARQUEE */
.mq{
  background:var(--navy);
  color:var(--milk);
  overflow:hidden;
  white-space:nowrap;
  padding:14px 0;
  font-weight:500;
  letter-spacing:.28em;
  font-size:13px;
}
.mq div{display:inline-block;animation:mq 32s linear infinite}
.mq span{padding:0 20px;opacity:.45}
@keyframes mq{to{transform:translateX(-50%)}}

/* HEAD */
.head{padding:56px 20px 8px}
.head h2{
  font-size:clamp(42px,12vw,96px);
  font-weight:600;
  line-height:.9;
  letter-spacing:.01em;
  text-transform:uppercase;
}
.head p{
  color:var(--mute);
  font-size:16px;
  max-width:32ch;
  margin-top:14px;
}

/* CHIPS */
.chips{
  display:flex;
  gap:8px;
  padding:18px 16px 20px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1.5px solid var(--ink);
  background:transparent;
  padding:11px 18px;
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
  border-radius:2px;
  transition:background .25s,color .25s,transform .25s var(--ease),border-color .25s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 12px 8px;
}
.card{display:flex;flex-direction:column}
.pic{
  aspect-ratio:4/5;
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative;
  border-radius:3px;
}
.pic svg{
  width:76%;
  height:76%;
  transition:transform .8s var(--ease);
}
.card:active .pic svg{transform:scale(1.06) rotate(-1.5deg)}
.tag{
  position:absolute;
  top:10px;left:10px;
  background:var(--navy);
  color:var(--milk);
  font-size:10px;
  font-weight:500;
  letter-spacing:.12em;
  padding:5px 9px;
  border-radius:2px;
}
.card h3{font-weight:500;font-size:15px;margin:12px 2px 0}
.meta{font-size:12px;color:var(--mute);margin:2px 2px 0}
.szs{display:flex;gap:5px;margin:10px 0 0;flex-wrap:wrap}
.sz{
  min-width:34px;
  height:32px;
  padding:0 8px;
  border:1px solid var(--line);
  font-size:12px;
  border-radius:2px;
  transition:all .2s;
}
.sz[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0 0;
  gap:8px;
}
.price{font-size:16px;font-weight:600}
.add{
  background:var(--navy);
  color:var(--milk);
  padding:12px 14px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  border-radius:2px;
  transition:background .25s,transform .25s var(--ease);
}
.add:active{transform:scale(.94)}
.add.ok{background:var(--brick)}

/* BAND */
.band{
  margin-top:64px;
  background:#0a0a0a;
  color:#f5f0e6;
  padding:64px 20px;
}
.band h2{
  font-size:clamp(32px,9vw,72px);
  font-weight:600;
  line-height:1;
  max-width:14ch;
  text-transform:uppercase;
}
.band p{margin-top:18px;max-width:34ch;opacity:.92;font-size:16px}

/* SOCIAL + FOOTER */
.social{
  display:flex;
  gap:16px;
  padding:40px 20px 12px;
  justify-content:center;
}
.social a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;height:48px;
  border:1.5px solid var(--line);
  border-radius:50%;
  transition:background .3s,border-color .3s,transform .3s var(--ease);
}
.social a:active{transform:scale(.92)}
.social a:hover{background:var(--navy);border-color:var(--navy);color:var(--milk)}
.social svg{width:22px;height:22px}
footer{
  padding:16px 20px 28px;
  color:var(--mute);
  font-size:12px;
  text-align:center;
}

/* REVEAL */
.rv{
  opacity:0;
  transform:translateY(24px);
  transition:opacity .85s var(--ease),transform .85s var(--ease);
  transition-delay:calc(var(--i,0)*70ms);
}
.rv.in{opacity:1;transform:none}

/* BOTTOM BAR */
.bar{
  position:fixed;
  left:12px;right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(247,243,234,.82);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  box-shadow:0 10px 32px rgba(28,34,51,.14);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 8px 6px 18px;
  z-index:5;
  border-radius:14px;
  transition:background .45s var(--ease), border-color .45s, box-shadow .45s;
}
body.dark .bar{
  background:rgba(18,20,28,.82);
}
.bar b{font-weight:600;letter-spacing:.28em;font-size:14px}
.bagbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 14px;
  font-weight:500;
  border-radius:10px;
}
.bagbtn svg{width:26px;height:26px}
.count{
  position:absolute;
  top:4px;left:28px;
  min-width:18px;height:18px;
  border-radius:9px;
  background:var(--brick);
  color:#fff;
  font-size:10px;
  display:grid;
  place-items:center;
  padding:0 4px;
}
.count[hidden],.bsum[hidden]{display:none}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.28)}}

/* TOAST */
.toast{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:50%;
  transform:translate(-50%,-100px);
  background:var(--ink);
  color:var(--milk);
  padding:13px 22px;
  font-size:14px;
  z-index:20;
  border-radius:8px;
  transition:transform .45s var(--ease);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.toast.on{transform:translate(-50%,0)}

/* CART SHEET */
.shade{
  position:fixed;inset:0;
  background:rgba(20,22,32,.55);
  opacity:0;pointer-events:none;
  transition:opacity .35s;
  z-index:8;
}
.sheet{
  position:fixed;
  left:0;right:0;bottom:0;
  max-height:86%;
  background:var(--milk);
  z-index:9;
  transform:translateY(105%);
  transition:transform .48s var(--ease);
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
  border-radius:18px 18px 0 0;
}
body.open .shade{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sh-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 22px 16px;
  border-bottom:1px solid var(--line);
  font-size:20px;
  font-weight:600;
}
.items{overflow:auto;padding:0 20px;min-height:100px;-webkit-overflow-scrolling:touch}
.it{
  display:grid;
  grid-template-columns:64px 1fr auto;
  gap:14px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  animation:rise .45s var(--ease) both;
}
.it .t{aspect-ratio:1;display:grid;place-items:center;border-radius:4px}
.it .t svg{width:78%;height:78%}
.it small{color:var(--mute);display:block;font-size:12px}
.qty{display:flex;align-items:center;gap:12px;margin-top:6px}
.qty button{
  width:32px;height:32px;
  border:1px solid var(--ink);
  border-radius:4px;
  font-size:16px;
}
.empty{padding:48px 0;color:var(--mute);text-align:center;font-size:15px}
.foot{padding:16px 20px 22px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;margin-bottom:14px;font-size:18px;font-weight:600}
.pay{
  width:100%;
  background:var(--navy);
  color:var(--milk);
  padding:18px;
  font-size:13px;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  border-radius:6px;
  transition:background .25s;
}
.pay:active{background:var(--brick)}
.guest{text-align:center;font-size:12px;color:var(--mute);margin-top:12px}

/* DESKTOP */
@media (min-width:760px){
  .grid{grid-template-columns:repeat(3,1fr);padding:0 24px;gap:18px}
  .head,.chips,.band,footer,.social{padding-left:48px;padding-right:48px}
  .hero{height:min(72vh, 720px);min-height:540px}
  .hui{padding:24px 48px 44px}
  .sheet{left:auto;width:420px;top:0;max-height:none;border-radius:0;right:0}
  .bar{left:50%;right:auto;width:420px;transform:translateX(-50%);border-radius:16px}
  .card:hover .pic svg{transform:scale(1.07) rotate(-2deg)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rise,.rv{opacity:1;transform:none}
  .bg img{animation:none;transform:scale(1.03)}
}

/* THEME TOGGLE */
.theme-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;height:40px;
  border-radius:10px;
  color:var(--ink);
  transition:transform .35s var(--ease), background .35s, color .35s;
}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .sun{display:none}
body.dark .theme-btn .sun{display:block}
body.dark .theme-btn .moon{display:none}


/* SPLASH / INTRO */
.splash{
  position:relative;
  width:100%;
  height:72svh;
  min-height:420px;
  max-height:620px;
  background:radial-gradient(ellipse at 50% 40%, #1a2744 0%, #0c1220 55%, #070b14 100%);
  color:#e8eef8;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  z-index:1;
}
.splash::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at 20% 30%, rgba(80,120,200,.12) 0%, transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(60,90,160,.1) 0%, transparent 40%);
  animation:glowPulse 12s ease-in-out infinite alternate;
  pointer-events:none;
}
.splash-logo{
  font-size:clamp(48px,16vw,140px);
  font-weight:600;
  letter-spacing:.08em;
  line-height:1;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(40px) scale(.96);
  animation:logoIn 1.8s cubic-bezier(.16,1,.3,1) .2s forwards;
  position:relative;
  z-index:2;
}
.splash-sub{
  margin-top:20px;
  font-size:clamp(11px,2.8vw,14px);
  letter-spacing:.42em;
  text-transform:uppercase;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) .9s forwards;
  color:rgba(200,215,240,.65);
  position:relative;
  z-index:2;
}
.splash-line{
  width:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(200,215,240,.5), transparent);
  margin:26px auto 0;
  opacity:0;
  animation:lineGrow 1.2s cubic-bezier(.16,1,.3,1) 1.3s forwards;
  position:relative;
  z-index:2;
}
.splash-btn{
  margin-top:40px;
  padding:14px 28px;
  font-size:12px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  border:1px solid rgba(200,215,240,.45);
  color:#e8eef8;
  background:transparent;
  opacity:0;
  transform:translateY(16px);
  animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  transition:background .35s,color .35s,border-color .35s,transform .3s;
  position:relative;
  z-index:2;
}
.splash-btn:hover{
  background:rgba(232,238,248,.95);
  color:#0c1220;
  border-color:transparent;
}
.splash-scroll{
  position:absolute;
  bottom:28px;
  left:0;right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  opacity:0;
  animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) 2s forwards;
  z-index:2;
}
.splash-scroll span{
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(200,215,240,.45);
}
.splash-scroll .arrow{
  width:16px;height:16px;
  border-right:1.5px solid rgba(200,215,240,.4);
  border-bottom:1.5px solid rgba(200,215,240,.4);
  transform:rotate(45deg);
  animation:bounce 2.2s ease-in-out infinite;
}
@keyframes logoIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}
@keyframes lineGrow{
  to{width:56px;opacity:1}
}
@keyframes bounce{
  0%,100%{transform:rotate(45deg) translateY(0);opacity:.5}
  50%{transform:rotate(45deg) translateY(8px);opacity:1}
}
@keyframes glowPulse{
  0%{opacity:.7;transform:scale(1)}
  100%{opacity:1;transform:scale(1.08)}
}




.splash-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.splash-logo,
.splash-sub,
.splash-line,
.splash-btn,
.splash-scroll{position:relative;z-index:2}


.chip, .add, .perk, .band, .card h3, .meta, .price, .sz, footer, .social a, .sheet, .sh-head, .foot, .pay {
  transition: background .45s var(--ease), color .45s var(--ease), border-color .45s var(--ease);
}

</style>
</head>
<body>

<section class="splash" id="splash">
  <canvas id="gl" class="splash-canvas"></canvas>
  <div class="splash-logo">VAYRON</div>
  <div class="splash-sub">Streetwear Division</div>
  <div class="splash-line"></div>
  <a class="splash-btn" href="#social">Связаться</a>
  <div class="splash-scroll">
    <span>Листай</span>
    <div class="arrow"></div>
  </div>
</section>

<script>
const U=["Один размер"],S=["S","M","L","XL"],SZ=["40","41","42","43","44","45"];
const P=[
  {id:1,n:"Худи Heavy",c:"Тёмно-синий",p:12900,s:"hoodie",k:"#1b2236",t:"#e4dccb",g:"Верх",z:S,h:"Хит"},
  {id:2,n:"Футболка Block",c:"Песочный",p:4900,s:"tee",k:"#c9b99a",t:"#d3d8e0",g:"Верх",z:S},
  {id:3,n:"Куртка Courier",c:"Кирпичный",p:21900,s:"jacket",k:"#8a4b3a",t:"#e9e1d0",g:"Верхняя",z:S,h:"Новинка"},
  {id:4,n:"Брюки Carpenter",c:"Графит",p:9900,s:"pants",k:"#3a3d44",t:"#eadacf",g:"Низ",z:S},
  {id:5,n:"Кепка Corner",c:"Молочный",p:3500,s:"cap",k:"#e8e2d2",t:"#cfd5de",g:"Аксессуары",z:U},
  {id:6,n:"Худи Crew",c:"Графит",p:11900,s:"hoodie",k:"#4a4e58",t:"#e2d9c6",g:"Верх",z:S},
  {id:7,n:"Кроссовки Urban",c:"Чёрный",p:15900,s:"sneaker",k:"#1a1a1a",t:"#e8e4dc",g:"Обувь",z:SZ,h:"Новинка"},
  {id:8,n:"Кроссовки Runner",c:"Песочный",p:14900,s:"sneaker",k:"#c9b99a",t:"#dfe3e8",g:"Обувь",z:SZ}
];
const cats=["Все","Верх","Верхняя","Низ","Обувь","Аксессуары"];
let cat="Все";const cart={},sel={};
const $=i=>document.getElementById(i),fmt=n=>n.toLocaleString("ru-RU")+" ₽";
const art=p=>`<svg style="color:${p.k}"><use href="#${p.s}"/></svg>`;
const words=["BUILT FOR THE STREETS","STREETWEAR DIVISION","VAYRON","НОВАЯ КОЛЛЕКЦИЯ"];
$("mq").innerHTML=(words.map(w=>w+"<span>✦</span>").join("")).repeat(4)+(words.map(w=>w+"<span>✦</span>").join("")).repeat(4);

const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12}):null;
const watch=()=>document.querySelectorAll(".rv:not(.in)").forEach(el=>io?io.observe(el):el.classList.add("in"));

function shop(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  $("grid").innerHTML=P.filter(p=>cat==="Все"||p.g===cat).map((p,i)=>{
    const z=sel[p.id]||(sel[p.id]=p.z[Math.min(1,p.z.length-1)]);
    return `<div class="card rv" style="--i:${i%4}">
      <div class="pic" style="background:${p.t}">${p.h?`<span class="tag">${p.h}</span>`:""}${art(p)}</div>
      <h3>${p.n}</h3>
      <div class="meta">${p.c}</div>
      <div class="szs">${p.z.map(s=>`<button class="sz" aria-pressed="${s===z}" data-z="${p.id}|${s}">${s}</button>`).join("")}</div>
      <div class="row"><span class="price">${fmt(p.p)}</span><button class="add" data-a="${p.id}">В корзину</button></div>
    </div>`;
  }).join("");
  watch();
}

function draw(){
  const ks=Object.keys(cart);let n=0,sum=0;
  $("items").innerHTML=ks.length?ks.map(k=>{
    const [i,z]=k.split("|"),p=P.find(x=>x.id==+i),q=cart[k];n+=q;sum+=q*p.p;
    return `<div class="it">
      <div class="t" style="background:${p.t}">${art(p)}</div>
      <div>${p.n}<small>${p.c} · ${z}</small>
        <div class="qty"><button data-m="${k}" aria-label="Меньше">−</button>${q}<button data-pl="${k}" aria-label="Больше">+</button></div>
      </div>
      <div>${fmt(q*p.p)}</div>
    </div>`;
  }).join(""):'<div class="empty">В корзине пока пусто</div>';
  $("count").textContent=n;$("count").hidden=!n;
  $("bsum").textContent=fmt(sum);$("bsum").hidden=!n;
  $("total").textContent=fmt(sum);
}

let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function bump(){const b=$("bagic");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
const toggle=o=>document.body.classList.toggle("open",o);

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){cat=t.dataset.c;shop()}
  if(t.dataset.z){const [i,z]=t.dataset.z.split("|");sel[i]=z;t.parentNode.querySelectorAll(".sz").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  if(t.dataset.a){
    const k=t.dataset.a+"|"+sel[t.dataset.a];
    cart[k]=(cart[k]||0)+1;draw();bump();toast("Добавлено в корзину");
    t.classList.add("ok");t.textContent="Добавлено";
    setTimeout(()=>{t.classList.remove("ok");t.textContent="В корзину"},1100);
  }
  if(t.dataset.pl){cart[t.dataset.pl]++;draw()}
  if(t.dataset.m){if(--cart[t.dataset.m]<1)delete cart[t.dataset.m];draw()}
  if(t.id==="openCart")toggle(true);
  if(t.id==="closeCart")toggle(false);
  if(t.id==="pay")$("items").innerHTML='<div class="empty">Демо: здесь откроется оформление как гость — имя, телефон, адрес.</div>';
});
$("shade").onclick=()=>toggle(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggle(false)});
shop();draw();watch();

// WebGL particles on splash
(function(){
  const canvas = document.getElementById("gl");
  if(!canvas) return;
  const gl = canvas.getContext("webgl", {alpha:true, antialias:true});
  if(!gl){ canvas.style.display="none"; return; }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  resize();
  window.addEventListener("resize", resize);

  const vs = `
    attribute vec3 aPos;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uTime;
    uniform vec2 uRes;
    varying float vAlpha;
    void main(){
      vec3 p = aPos;
      p.x += sin(uTime*0.15 + aPos.z*3.0)*0.04;
      p.y += cos(uTime*0.12 + aPos.x*2.5)*0.03;
      vec2 screen = p.xy;
      // slight perspective
      float z = 0.55 + p.z*0.45;
      screen /= z;
      vec2 clip = screen;
      clip.x *= uRes.y / uRes.x;
      gl_Position = vec4(clip, 0.0, 1.0);
      gl_PointSize = aSize * (1.2/z) * (uRes.y/600.0);
      vAlpha = aAlpha * (0.5 + 0.5*sin(uTime*0.4 + aPos.z*5.0));
    }
  `;
  const fs = `
    precision mediump float;
    varying float vAlpha;
    void main(){
      float d = length(gl_PointCoord - vec2(0.5));
      if(d > 0.5) discard;
      float soft = smoothstep(0.5, 0.1, d);
      vec3 col = mix(vec3(0.35,0.5,0.85), vec3(0.7,0.82,1.0), soft);
      gl_FragColor = vec4(col, soft * vAlpha * 0.7);
    }
  `;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const N = 180;
  const pos = new Float32Array(N*3);
  const size = new Float32Array(N);
  const alpha = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]   = (Math.random()*2-1)*1.3;
    pos[i*3+1] = (Math.random()*2-1)*1.3;
    pos[i*3+2] = Math.random();
    size[i] = 2 + Math.random()*5;
    alpha[i] = 0.25 + Math.random()*0.75;
  }

  function buf(data, loc, sizeN){
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, sizeN, gl.FLOAT, false, 0, 0);
  }
  buf(pos, gl.getAttribLocation(prog,"aPos"), 3);
  buf(size, gl.getAttribLocation(prog,"aSize"), 1);
  buf(alpha, gl.getAttribLocation(prog,"aAlpha"), 1);

  const uTime = gl.getUniformLocation(prog,"uTime");
  const uRes = gl.getUniformLocation(prog,"uRes");

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  let start = performance.now();
  function frame(now){
    const t = (now - start) / 1000;
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.POINTS, 0, N);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();


// Theme
const themeBtn = document.getElementById("themeBtn");
const saved = localStorage.getItem("vayron-theme");
if(saved === "dark") document.body.classList.add("dark");
themeBtn.onclick = () => {
  themeBtn.style.transform = "scale(0.85) rotate(-20deg)";
  setTimeout(() => { themeBtn.style.transform = ""; }, 280);
  document.body.classList.toggle("dark");
  localStorage.setItem("vayron-theme", document.body.classList.contains("dark") ? "dark" : "light");
};

</script>
